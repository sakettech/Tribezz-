<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Tribezz • Welcome Back</title>

  <!-- Google Fonts: Outfit & Plus Jakarta Sans -->
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    :root {
      --bg-dark: #030508;
      --card-bg: rgba(13, 19, 32, 0.72);
      --primary-gradient: linear-gradient(135deg, #00f2fe 0%, #8b5cf6 50%, #f43f5e 100%);
      --accent-cyan: #00f2fe;
      --accent-purple: #8b5cf6;
      --accent-emerald: #10b981;
      --text-main: #ffffff;
      --text-muted: #94a3b8;
      --border-glass: rgba(255, 255, 255, 0.08);
      --input-bg: rgba(255, 255, 255, 0.035);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Plus Jakarta Sans', sans-serif;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      background-color: #000205;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .mobile-frame {
      width: 100%;
      max-width: 412px;
      height: 100vh;
      background-color: var(--bg-dark);
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
      box-shadow: 0 30px 80px -20px rgba(139, 92, 246, 0.35), 0 0 0 1px var(--border-glass);
    }

    .glow-light {
      position: absolute;
      border-radius: 50%;
      filter: blur(90px);
      pointer-events: none;
      opacity: 0.35;
      z-index: 1;
    }
    .glow-1 { width: 280px; height: 280px; top: -80px; right: -60px; background: #8b5cf6; }
    .glow-2 { width: 240px; height: 240px; bottom: 80px; left: -60px; background: #00f2fe; }

    .content-scroll-wrap {
      flex: 1;
      overflow-y: auto;
      padding: 60px 22px 20px 22px;
      display: flex;
      flex-direction: column;
      align-items: center;
      z-index: 5;
      scrollbar-width: none;
    }
    .content-scroll-wrap::-webkit-scrollbar { display: none; }

    .brand-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      margin-bottom: 28px;
    }

    .brand-icon-box {
      width: 64px;
      height: 64px;
      border-radius: 22px;
      background: linear-gradient(135deg, rgba(0,242,254,0.12), rgba(139,92,246,0.22));
      border: 1.5px solid rgba(0, 242, 254, 0.35);
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 0 30px rgba(0, 242, 254, 0.3);
      margin-bottom: 12px;
    }
    .brand-icon-box svg { width: 34px; height: 34px; filter: drop-shadow(0 0 8px rgba(0,242,254,0.6)); }

    .brand-title {
      font-family: 'Outfit', sans-serif;
      font-size: 36px;
      font-weight: 900;
      letter-spacing: -1.2px;
      background: var(--primary-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .brand-subtitle {
      font-size: 13px;
      color: var(--text-muted);
      font-weight: 500;
      margin-top: 2px;
    }

    .form-card {
      width: 100%;
      background: var(--card-bg);
      backdrop-filter: blur(28px);
      -webkit-backdrop-filter: blur(28px);
      border: 1px solid var(--border-glass);
      border-radius: 26px;
      padding: 26px 18px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7);
      margin-bottom: 16px;
    }

    .field-group {
      margin-bottom: 16px;
      position: relative;
    }

    .field-box {
      width: 100%;
      height: 50px;
      background: var(--input-bg);
      border: 1px solid var(--border-glass);
      border-radius: 16px;
      padding: 0 14px 0 46px;
      display: flex;
      align-items: center;
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      position: relative;
    }
    .field-box:focus-within {
      border-color: var(--accent-cyan);
      background: rgba(255, 255, 255, 0.06);
      box-shadow: 0 0 18px rgba(0, 242, 254, 0.22);
    }

    .field-box i.f-icon {
      position: absolute;
      left: 15px;
      color: #64748b;
      transition: color 0.2s;
    }
    .field-box:focus-within i.f-icon { color: var(--accent-cyan); }

    .field-box input {
      width: 100%;
      background: none;
      border: none;
      color: #fff;
      font-size: 13.5px;
      outline: none;
      font-weight: 500;
    }
    .field-box input::placeholder { color: #526177; font-weight: 500; }

    .toggle-pass-btn {
      background: none;
      border: none;
      color: #64748b;
      cursor: pointer;
      padding: 6px;
      display: flex;
      align-items: center;
    }

    .btn-main {
      width: 100%;
      height: 50px;
      background: var(--primary-gradient);
      border: none;
      border-radius: 16px;
      color: #ffffff;
      font-size: 15px;
      font-weight: 800;
      letter-spacing: 0.3px;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      box-shadow: 0 10px 28px rgba(139, 92, 246, 0.45);
      margin-top: 8px;
      transition: transform 0.15s ease, opacity 0.2s;
    }
    .btn-main:active { transform: scale(0.97); }
    .btn-main:disabled { opacity: 0.65; cursor: not-allowed; }

    .alert-card {
      width: 100%;
      padding: 12px 14px;
      border-radius: 14px;
      font-size: 12px;
      font-weight: 600;
      display: none;
      margin-bottom: 16px;
    }
    .alert-card.error { display: block; background: rgba(244, 63, 94, 0.15); border: 1px solid rgba(244, 63, 94, 0.4); color: #fecdd3; }

    /* ==================== 100% PERFECT CENTERED SUCCESS POPUP ==================== */
    .success-modal-overlay {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(2, 4, 8, 0.88);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      z-index: 999;
      display: none;
      justify-content: center;
      align-items: center;
      padding: 24px;
    }
    .success-modal-overlay.show {
      display: flex;
      animation: fadeInBackdrop 0.25s ease-out;
    }
    @keyframes fadeInBackdrop {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .success-card {
      width: 100%;
      max-width: 320px;
      background: #0e1526;
      border: 1px solid rgba(0, 242, 254, 0.4);
      border-radius: 28px;
      padding: 28px 22px 22px 22px;
      text-align: center;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.95), 0 0 35px rgba(0, 242, 254, 0.25);
      animation: popCenterScale 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    @keyframes popCenterScale {
      from { transform: scale(0.75); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    .success-icon-ring {
      width: 68px;
      height: 68px;
      border-radius: 50%;
      background: linear-gradient(135deg, rgba(0,242,254,0.2), rgba(16,185,129,0.3));
      border: 2px solid #10b981;
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 0 auto 16px auto;
      box-shadow: 0 0 28px rgba(16, 185, 129, 0.5);
      animation: pulseModalGlow 1.8s infinite;
    }
    @keyframes pulseModalGlow {
      0%, 100% { transform: scale(1); box-shadow: 0 0 20px rgba(16, 185, 129, 0.4); }
      50% { transform: scale(1.08); box-shadow: 0 0 32px rgba(16, 185, 129, 0.8); }
    }

    .success-card h3 { font-size: 19px; font-weight: 800; color: #fff; margin-bottom: 8px; }
    .success-card p { font-size: 13px; color: var(--text-muted); line-height: 1.45; margin-bottom: 20px; }

    .modal-proceed-btn {
      width: 100%;
      height: 46px;
      background: var(--primary-gradient);
      border: none;
      border-radius: 14px;
      color: #fff;
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 6px;
      box-shadow: 0 6px 20px rgba(139, 92, 246, 0.4);
      transition: transform 0.15s ease;
    }
    .modal-proceed-btn:active { transform: scale(0.96); }

    .bottom-bar {
      width: 100%;
      background: rgba(8, 12, 20, 0.95);
      backdrop-filter: blur(18px);
      border-top: 1px solid var(--border-glass);
      padding: 18px;
      text-align: center;
      z-index: 10;
    }
    .bottom-bar p { font-size: 13px; color: var(--text-muted); }
    .switch-btn { color: var(--accent-cyan); font-weight: 800; text-decoration: none; margin-left: 5px; }

    .spinner {
      width: 18px; height: 18px;
      border: 2.5px solid #fff;
      border-top-color: transparent;
      border-radius: 50%;
      display: none;
      animation: spin 0.6s linear infinite;
    }
    @keyframes spin { 100% { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <div class="mobile-frame">
    <div class="glow-light glow-1"></div>
    <div class="glow-light glow-2"></div>

    <!-- ==================== EXACT CENTERED LOGIN SUCCESS MODAL ==================== -->
    <div class="success-modal-overlay" id="loginSuccessModal">
      <div class="success-card">
        <div class="success-icon-ring">
          <i data-lucide="check" size="34" color="#10b981"></i>
        </div>
        <h3 id="loginModalTitle">Login Verified! ⚡</h3>
        <p id="loginModalDesc">Your credentials have been matched with Google Sheets.</p>
        <button type="button" class="modal-proceed-btn" onclick="goToFeedPage()">
          <span>Okay, Go to Feed</span>
          <i data-lucide="arrow-right" size="16"></i>
        </button>
      </div>
    </div>

    <div class="content-scroll-wrap">
      
      <div class="brand-section">
        <div class="brand-icon-box">
          <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <linearGradient id="tribezzGradLog" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#00f2fe"/>
                <stop offset="50%" stop-color="#8b5cf6"/>
                <stop offset="100%" stop-color="#f43f5e"/>
              </linearGradient>
            </defs>
            <path d="M 24,26 L 76,26 L 36,52 L 76,52 L 36,78 L 76,78" stroke="url(#tribezzGradLog)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
        </div>
        <h1 class="brand-title">Tribezz</h1>
        <p class="brand-subtitle">Log in to your student dashboard</p>
      </div>

      <div class="alert-card" id="alertBox"></div>

      <div class="form-card">
        <form onsubmit="submitLogin(event)">
          <div class="field-group">
            <div class="field-box">
              <i data-lucide="user-check" size="17" class="f-icon"></i>
              <input type="text" id="loginUsername" placeholder="Username or College Email" required />
            </div>
          </div>

          <div class="field-group">
            <div class="field-box">
              <i data-lucide="lock" size="17" class="f-icon"></i>
              <input type="password" id="loginPassword" placeholder="Password" required />
              <button type="button" class="toggle-pass-btn" onclick="togglePass('loginPassword', this)">
                <i data-lucide="eye" size="16"></i>
              </button>
            </div>
          </div>

          <button type="submit" class="btn-main" id="btnLogin">
            <span id="btnText">Log In</span>
            <div class="spinner" id="btnSpinner"></div>
          </button>
        </form>
      </div>

    </div>

    <footer class="bottom-bar">
      <p>Don't have an account? <a href="signup.html" class="switch-btn">Sign Up</a></p>
    </footer>
  </div>

  <script>
    lucide.createIcons();

    const GOOGLE_SHEET_WEBHOOK_URL = "https://script.google.com/macros/s/AKfycbzm7QbstEDAM1Ih8-sINvOVExTyHh8Sqtv-Xdt-XDmqCxk-lpAg9hpaZEFyOFW6WMZsuQ/exec";

    function togglePass(id, btn) {
      const input = document.getElementById(id);
      if (input.type === 'password') {
        input.type = 'text';
        btn.innerHTML = '<i data-lucide="eye-off" size="16"></i>';
      } else {
        input.type = 'password';
        btn.innerHTML = '<i data-lucide="eye" size="16"></i>';
      }
      lucide.createIcons();
    }

    async function submitLogin(e) {
      e.preventDefault();
      const alert = document.getElementById('alertBox');
      alert.style.display = 'none';

      const loginId = document.getElementById('loginUsername').value.trim();
      const password = document.getElementById('loginPassword').value;

      const btn = document.getElementById('btnLogin');
      const spinner = document.getElementById('btnSpinner');
      const btnText = document.getElementById('btnText');

      btn.disabled = true;
      spinner.style.display = 'block';
      btnText.innerText = "Verifying with Sheet...";

      const payload = {
        action: "login",
        loginId: loginId,
        password: password
      };

      try {
        const res = await fetch(GOOGLE_SHEET_WEBHOOK_URL, {
          method: 'POST',
          body: JSON.stringify(payload)
        });
        const result = await res.json();

        if (result.success && result.user) {
          // Save Active User Session for index.html / Profile.html
          const userObj = {
            name: result.user.name,
            username: result.user.username,
            handle: result.user.username,
            email: result.user.email,
            ecoPoints: result.user.ecoPoints || 50,
            avatar: result.user.avatar
          };

          localStorage.setItem('tribezz_user_profile', JSON.stringify(userObj));
          localStorage.setItem('user_name', result.user.name);
          localStorage.setItem('user_handle', result.user.username);
          localStorage.setItem('user_email', result.user.email);
          localStorage.setItem('user_points', result.user.ecoPoints || 50);
          localStorage.setItem('user_avatar', result.user.avatar);

          // Trigger Center Modal Popup
          document.getElementById('loginModalTitle').innerText = `Welcome Back, ${result.user.name.split(' ')[0]}! ⚡`;
          document.getElementById('loginModalDesc').innerText = "Verified credentials from Google Sheets. Tap below to continue.";
          document.getElementById('loginSuccessModal').classList.add('show');
          lucide.createIcons();
        } else {
          alert.className = "alert-card error";
          alert.innerText = result.message || "Invalid Username/Email or Password.";
          alert.style.display = "block";
        }
      } catch (err) {
        alert.className = "alert-card error";
        alert.innerText = "Error connecting to Google Sheet database.";
        alert.style.display = "block";
      } finally {
        btn.disabled = false;
        spinner.style.display = 'none';
        btnText.innerText = "Log In";
      }
    }

    // Modal Action Handler
    function goToFeedPage() {
      window.location.href = "index.html";
    }
  </script>
</body>
</html>
